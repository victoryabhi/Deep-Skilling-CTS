# Application Configuration
spring.application.name=Spring REST Module 7

# Server Port Configuration
server.port=8080

# H2 Database In-Memory Settings
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA/Hibernate Auto DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Boot Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# Custom Info Properties for Actuator
info.app.name=Cognizant Deep Skilling Spring Boot REST API
info.app.description=Module 7 Assignment Project
info.app.version=1.0.0
