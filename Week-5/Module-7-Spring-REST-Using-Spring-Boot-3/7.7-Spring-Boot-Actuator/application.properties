# Spring Boot Actuator Configuration Settings

# Expose web endpoints for production monitoring
management.endpoints.web.exposure.include=health,info,metrics,env,beans

# Health endpoint details visibility
management.endpoint.health.show-details=always

# Custom metadata exposed via /actuator/info
info.app.name=Cognizant Deep Skilling REST Application
info.app.description=Spring Boot 3 Actuator Topic 7.7
info.app.version=1.0.0
info.company=Cognizant Technology Solutions
